<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Join Classroom</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #111215;
            color: #f1f5f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .classroom-container {
            background: #1e1e24;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 900px;
        }
        .input-group {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        input {
            padding: 12px;
            font-size: 18px;
            border-radius: 6px;
            border: 2px solid #334155;
            background: #141419;
            color: white;
            text-align: center;
            letter-spacing: 2px;
            width: 150px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #2ecc71;
            color: white;
            transition: all 0.2s;
        }
        button:hover { background-color: #27ae60; }
        button:disabled { background-color: #4b5563; cursor: not-allowed; }
        .status { margin-bottom: 20px; font-weight: bold; color: #eab308; }
        
        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (max-width: 600px) {
            .video-grid { grid-template-columns: 1fr; }
        }
        .video-box {
            background: #141419;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #334155;
        }
        video {
            width: 100%;
            border-radius: 6px;
            background: #000;
        }
        .local-video {
            transform: scaleX(-1);
        }
        p { margin: 8px 0 0 0; font-size: 14px; color: #94a3b8; font-weight: bold; }
    </style>
</head>
<body>

    <div class="classroom-container">
<img src="school_logo.png" alt="School Logo" height="60" onerror="this.style.display='none';">
        <h2>eNabumali Student portal</h2>
        <div id="status" class="status">Requesting permissions...</div>
        
        <div class="input-group">
            <input type="text" id="join-code" placeholder="6-Digit Code" maxlength="6">
            <button id="join-btn" onclick="joinClassroom()" disabled>Join Class</button>
        </div>

        <div class="video-grid">
            <div class="video-box">
                <video id="local-video" class="local-video" autoplay playsinline muted></video>
                <p>👤 You (Student)</p>
            </div>
            <div class="video-box">
                <video id="remote-video" autoplay playsinline></video>
                <p>👨‍🏫 Teacher Feed</p>
            </div>
        </div>
    </div>

    <script>
        let localStream;
        let peer;

        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;

                peer = new Peer();

                peer.on('open', () => {
                    document.getElementById('status').textContent = "Ready to connect. Enter your teacher's room code.";
                    document.getElementById('join-btn').disabled = false;
                });

                peer.on('error', (err) => {
                    console.error(err);
                    document.getElementById('status').textContent = "❌ Peer connection error.";
                });

            } catch (err) {
                document.getElementById('status').textContent = "⚠️ Error: Please allow Camera & Microphone access.";
                console.error(err);
            }
        }

        function joinClassroom() {
            const code = document.getElementById('join-code').value.trim();
            if (code.length !== 6 || isNaN(code)) {
                alert("Please enter a valid 6-digit number.");
                return;
            }

            document.getElementById('status').textContent = "Connecting to teacher room: " + code;
            document.getElementById('join-btn').disabled = true;

            const call = peer.call('classroom-' + code, localStream);

            if (call) {
                call.on('stream', (remoteStream) => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                    document.getElementById('status').textContent = "🟢 Connected to Classroom!";
                    document.getElementById('status').style.color = "#2ecc71";
                });

                call.on('error', (err) => {
                    console.error(err);
                    document.getElementById('status').textContent = "❌ Failed to link feed.";
                    document.getElementById('join-btn').disabled = false;
                });
            } else {
                document.getElementById('status').textContent = "❌ Failed to route call.";
                document.getElementById('join-btn').disabled = false;
            }
        }

        window.onload = initCamera;
    </script>
</body>
</html>
